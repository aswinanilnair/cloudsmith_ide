[pytest]
# Run with scripts/test.sh, which sets up .venv and Docker. See tests/README.md.
testpaths = tests/test_api tests/test_agent tests/test_proxy tests/test_config
addopts = --import-mode=importlib -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: end-to-end tests against a running CloudSmith (local stack or GCP); slow
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
