# Log-based metric: how many workspaces each worker holds, read from the API's
# "worker heartbeat" log line (one per worker every 10 seconds). scripts/setup.sh creates it.
description: CloudSmith workspaces assigned to each worker (from the API's heartbeat log lines)
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="cloudsmith-api"
  AND jsonPayload.message="worker heartbeat"
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
  labels:
    - key: worker
      valueType: STRING
valueExtractor: EXTRACT(jsonPayload.workspaces)
labelExtractors:
  worker: EXTRACT(jsonPayload.worker)
bucketOptions:
  linearBuckets:
    numFiniteBuckets: 20
    width: 1
    offset: 0
