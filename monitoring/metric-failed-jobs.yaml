# Log-based metric: workspace jobs that failed on a worker, counted from the API's
# "job failed" log line (written when an agent reports FAILED). scripts/setup.sh creates it.
description: CloudSmith workspace jobs that failed, per worker
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name="cloudsmith-api"
  AND jsonPayload.message="job failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: worker
      valueType: STRING
labelExtractors:
  worker: EXTRACT(jsonPayload.worker)
